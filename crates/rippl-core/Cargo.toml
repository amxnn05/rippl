[package]
name = "rippl-core"
description = "Browser logic with no GTK or WebKit in it: addresses, tabs, the sleep policy."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# The system's SQLite, not a bundled copy: smaller binary, distro security updates.
rusqlite = "0.43"
serde_json = "1"
# Chromium's saved passwords on Linux: AES-128-CBC under a PBKDF2-SHA1 key.
aes = "0.8"
cbc = "0.1"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
sha1 = "0.10"
