[package]
name = "rippl-desktop"
description = "rippl for macOS and Windows: the same browser on the system's own engine (WKWebView, WebView2)."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "rippl-desktop"
path = "src/main.rs"

[dependencies]
rippl-core = { path = "../crates/rippl-core" }
tao = "0.38"
wry = { version = "0.58", features = ["devtools", "mac-proxy"] }
muda = "0.22"
serde_json = "1"
getrandom = "0.3"
ureq = { version = "3", default-features = false, features = ["rustls", "gzip"] }
arboard = { version = "3", default-features = false }
zip = { version = "2", default-features = false, features = ["deflate"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "vendored"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", features = ["NSString", "NSURL", "NSError"] }
objc2-app-kit = { version = "0.3.2", features = ["NSView", "NSResponder"] }
objc2-web-kit = { version = "0.3.2", features = ["WKContentRuleList", "WKContentRuleListStore", "WKUserContentController", "WKWebView", "block2"] }
block2 = "0.6"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Com"] }
windows-core = "0.62"
adblock = { version = "0.13", default-features = false, features = ["embedded-domain-resolver", "full-regex-handling"] }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
gtk = "0.19"
webkit2gtk = { version = "3.0", features = ["v2_40"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
rusqlite = { version = "0.43", features = ["bundled"] }

[build-dependencies]
embed-resource = "3"
