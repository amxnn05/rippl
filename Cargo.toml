[workspace]
resolver = "2"
members = ["crates/rippl-core", "crates/rippl-web-extension", "app", "desktop"]

[workspace.package]
version = "1.0.0"
edition = "2024"
license = "MIT"

[profile.release]
# Small binary, fast code: the UI process should cost as little as possible.
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
